name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: syntax check (node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Parse every source module
        run: |
          set -euo pipefail
          find . -path ./.git -prune -o -name '*.js' -print0 \
            | xargs -0 -n1 node --check

  test:
    name: run tests (node 24)
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dev dependencies when a lockfile is present
        run: |
          if [ -f package-lock.json ] || [ -f package.json ]; then
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
          fi

      - name: Run test suite (skipped if no test files)
        run: |
          if [ -d test ]; then
            npm test
          else
            echo "No test/ tree on this branch — suite skipped (OK)."
          fi

  build:
    name: build static site artifact
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # This project is a no-build static site served from the repo root.
      - name: Upload static site as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: .

  deploy:
    name: deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
