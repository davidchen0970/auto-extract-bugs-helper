name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The project is pure client-side ES modules loaded straight from the source
  # tree (index.html -> app.js -> src/core), so there is no build to run.
  # `node --check` in every current module is the real "it parses" gate.
  syntax:
    name: syntax check (node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Parse every source module
        run: |
          set -euo pipefail
          # Root-level browser entry + all core modules. Deliberately avoids
          # `find src test` so a future move stays self-discovering.
          find . -path ./.git -prune -o -name '*.js' -print0 \
            | xargs -0 -n1 node --check

  # `npm test` runs the built-in `node --test` runner. The repo is a viewer
  # blueprint with optional tests: only run the suite when a test/ tree exists so a
  # branch that has not been given tests yet still stays green.
  test:
    name: run tests (node 24)
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dev dependencies when a lockfile is present
        run: |
          if [ -f package-lock.json ] || [ -f package.json ]; then
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
          fi

      - name: Run test suite (skipped if no test files)
        run: |
          if [ -d test ]; then
            npm test
          else
            echo "No test/ tree on this branch — suite skipped (OK)."
          fi
