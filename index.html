<!DOCTYPE html>
<html lang="zh-Hant">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Bug Tarball Viewer · 缺陷預覽工作台</title>
	<link rel="stylesheet" href="app.css">
</head>

<body>

	<header class="topbar">
		<div class="brand">
			<div>
				<h1>Bug Tarball Viewer</h1>
				<p class="tag">解析 tar / tar.gz 或單一報表檔並逐一預覽缺陷</p>
			</div>
		</div>
		<div class="top-actions">
			<button id="btn-theme" class="btn desktop-act" title="切換亮/暗主題">切換主題</button>
			<button id="btn-open" class="btn primary desktop-act">開啟 tar / tar.gz / 報表</button>
			<button id="menu-toggle" class="btn primary menu-toggle" aria-haspopup="true" aria-expanded="false">選單 ▾</button>
			<nav id="menu" class="menu" aria-label="操作選單">
				<button id="menu-open" class="menu-item primary">開啟 tar / tar.gz / 報表</button>
				<button id="menu-theme" class="menu-item">切換主題</button>
			</nav>
			<input type="file" id="file-input" accept=".tar,.tar.gz,.tgz,.gz,.html,.csv,application/x-tar,application/gzip,text/html,text/csv" hidden>
		</div>
	</header>


	<section id="dropzone" class="dropzone">
		<div class="dz-inner">
			<h2>將 tar 或報表檔拖放於此</h2>
			<p class="dz-sub">支援 <code>.tar</code>、<code>.tar.gz</code>、<code>.tgz</code>，也可直接拖入單一的 <code>.html</code> ／ <code>.csv</code> 報表檔。完全在瀏覽器內解析，檔案不會上傳。</p>
			<p class="dz-hint">會自動辨識 Coverity 靜態分析報表、BlackDuck 弱點清單與建置產物。</p>
			<button id="btn-browse" class="btn">選擇檔案</button>
		</div>
	</section>

	<main id="workbench" class="workbench" hidden>

		<section class="panel archive">
			<div class="panel-head">
				<h2 class="panel-title">壓縮檔內容</h2>
				<span id="archive-meta" class="muted"></span>
			</div>
			<div id="archive-list" class="archive-list"></div>
		</section>

		<section class="panel sources">
			<div class="panel-head">
				<h2 class="panel-title">缺陷來源</h2>
			</div>
			<div id="source-tabs" class="tabs"></div>
			<div id="source-views" class="source-views"></div>
		</section>
	</main>


	<div id="drawer-overlay" class="drawer-overlay"></div>
	<section id="drawer" class="drawer" aria-hidden="true">
		<header class="drawer-head">
			<span class="drawer-title">缺陷詳情</span>
			<span class="drawer-actions">
				<button id="drawer-download" class="btn sm">下載 JSON</button>
				<button id="drawer-close" class="btn sm">關閉</button>
			</span>
		</header>
		<div id="drawer-body" class="drawer-body"></div>
	</section>

	<div id="toast" class="toast" hidden></div>

	<script type="module" src="app.js"></script>
</body>

</html>
